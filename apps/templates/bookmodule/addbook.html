{% extends "layouts/base.html" %}

{% block content %}

<h2>Add Book</h2>

<form method="POST">

    {% csrf_token %}

    Title:
    <input type="text" name="title">
    <br><br>

    Author:
    <input type="text" name="author">
    <br><br>

    Price:
    <input type="number" step="0.01" name="price">
    <br><br>

    Edition:
    <input type="number" name="edition">
    <br><br>

    <button type="submit">Save</button>

</form>

{% endblock %}
